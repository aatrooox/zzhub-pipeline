<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><style>{{COVER_CSS}}</style></head>
<body>
<main class="cover cover-banner" style="{{COVER_STYLE}}">
  {{COVER_LAYERS}}
  <section class="copy">
    <div class="text-area"><div class="text-stack">
      <h1 class="title">{{TITLE_HTML}}</h1>
      <div class="subtitle">{{SUBTITLE_HTML}}</div>
    </div></div>
    <footer class="signature"><span>{{FOOTER_TEXT}}</span></footer>
  </section>
  <aside class="logo-panel">{{BRAND_IMAGE}}</aside>
</main>
<script type="application/json" id="cover-config">{{COVER_CONFIG}}</script>
<script id="cover-script" src="{{COVER_SCRIPT_URL}}" defer></script>
</body>
</html>
